<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ваше отделение — Почта России</title>
    <link rel="stylesheet" href="/src/login.css" />
  </head>
  <body>
    <main class="login-layout">
      <section class="login-card">
        <img class="login-logo" src="/assets/logo.svg" alt="Почта России" />
        <p class="eyebrow">Электронная очередь</p>
        <h1>Добро пожаловать</h1>
        <p id="visitor-department" class="description"></p>
        <p class="description">
          Выберите услугу и получите талон на своём телефоне. Вход и установка приложения не нужны.
        </p>
        <a
          id="join"
          class="login-submit"
          style="display: block; text-align: center; text-decoration: none; padding: 15px"
          hidden
          >Получить талон</a
        >
        <p class="demo-note">После выдачи талон попадёт в очередь отделения.</p>
        <a class="visitor-link" href="/booking">Записаться на другой день →</a>
      </section>
    </main>
    <script type="module" src="/src/visitor.js"></script>
  </body>
</html>
