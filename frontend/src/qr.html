<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QR отделения — Почта России</title><link rel="stylesheet" href="/src/staff.css"><link rel="stylesheet" href="/src/navigation.css"><style>@media print{.app-navigation,.qr-settings{display:none!important}body{background:white}main{padding:0}.card{border:0}#qr-image{break-inside:avoid}}#qr-image svg{max-width:100%;height:auto}</style></head><body><main style="max-width:760px"><section class="card"><img src="/assets/logo.svg" width="220" alt="Почта России"><h1 class="section-gap">Электронная очередь</h1><p>Отсканируйте QR-код камерой телефона, выберите услугу и получите электронный талон.</p><div class="qr-settings"><label for="site-url">Публичный адрес сайта (HTTPS)</label><input id="site-url" type="url" placeholder="https://ваш-сайт.netlify.app"><label for="qr-branch">Отделение</label><select id="qr-branch"></select><button id="generate" class="primary section-gap">Создать QR-код</button></div><p id="qr-message" role="status"></p><div id="qr-image" style="text-align:center"></div><h2 id="qr-address"></h2><p><a id="qr-link" class="link" hidden>Открыть страницу посетителя →</a></p><button class="qr-settings ghost" id="print" hidden>Распечатать QR-код</button><p class="muted">Посетителю не нужны приложение и аккаунт. Требуется интернет.</p></section></main><script src="/assets/qrcode.js"></script><script type="module" src="/src/qr.js"></script><script type="module" src="/src/navigation.js"></script></body></html>
