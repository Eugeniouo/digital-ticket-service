services:
  api: &main_app
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    image: query_service:${QUERY_SERVICE_VERSION:-latest}
    restart: always
    ports:
      # Exposes application port.
    - "8000:8000"
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      QUERY_SERVICE_HOST: 0.0.0.0
      QUERY_SERVICE_RELOAD: "True"
      QUERY_SERVICE_DB_HOST: query-service-db
      QUERY_SERVICE_DB_PORT: 5432
      QUERY_SERVICE_DB_USER: query_service
      QUERY_SERVICE_DB_PASS: query_service
      QUERY_SERVICE_DB_BASE: query_service
    volumes:
      - .:/app/src/

  db:
    image: postgres:18.3-trixie
    hostname: query-service-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: "query_service"
      POSTGRES_USER: "query_service"
      POSTGRES_DB: "query_service"
    volumes:
      - query-service-db-data:/var/lib/postgresql
    restart: always
    healthcheck:
      test: pg_isready -U query_service
      interval: 2s
      timeout: 3s
      retries: 40

  migrator:
    <<: *main_app
    restart: "no"
    command: sh -c "alembic upgrade head && python -m query_service.bootstrap_staff"
    depends_on:
      db:
        condition: service_healthy

  valkey:
    image: valkey/valkey:8
    hostname: query-service-valkey
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 40

  celery_worker:
    <<: *main_app
    ports: []
    command: celery -A query_service.celery_app worker -l INFO
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      QUERY_SERVICE_HOST: 0.0.0.0
      QUERY_SERVICE_RELOAD: "True"
      QUERY_SERVICE_DB_HOST: query-service-db
      QUERY_SERVICE_DB_PORT: 5432
      QUERY_SERVICE_DB_USER: query_service
      QUERY_SERVICE_DB_PASS: query_service
      QUERY_SERVICE_DB_BASE: query_service
      QUERY_SERVICE_CELERY_BROKER_URL: redis://query-service-valkey:6379/0

  celery_beat:
    <<: *main_app
    ports: []
    command: celery -A query_service.celery_app beat -l INFO --schedule /tmp/celerybeat-schedule
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      QUERY_SERVICE_HOST: 0.0.0.0
      QUERY_SERVICE_RELOAD: "True"
      QUERY_SERVICE_DB_HOST: query-service-db
      QUERY_SERVICE_DB_PORT: 5432
      QUERY_SERVICE_DB_USER: query_service
      QUERY_SERVICE_DB_PASS: query_service
      QUERY_SERVICE_DB_BASE: query_service
      QUERY_SERVICE_CELERY_BROKER_URL: redis://query-service-valkey:6379/0

  frontend:
    build:
      context: frontend
    ports:
      - "18473:4173"
    environment:
      PORT: "4173"
      HOST: "0.0.0.0"

  proxy:
    image: caddy:2-alpine
    ports:
      - "18080:80"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
      - frontend

volumes:
  query-service-db-data:
    name: query-service-db-data
  caddy_data:
