---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
    - repo: local
      hooks:
          # если вы хотите, можно закомментировать ruff
          - id: ruff-format
            name: Format with Ruff
            entry: uv run ruff format
            language: system
            pass_filenames: false
            always_run: true

          - id: ruff
            name: Check with Ruff
            entry: uv run ruff
            language: system
            pass_filenames: false
            always_run: true
            args: ["check", "backend/query_service", "backend/tests", "--fix"]

          - id: mypy
            name: Validate types with MyPy
            entry: uv run mypy
            language: system
            types: [python]
            pass_filenames: false
            args:
              - "backend/query_service"
              - "backend/tests"
